name: APK Android

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - 'LICENSE'
      - 'NOTICE'
      - 'android/**'
      - 'web/**'
      - 'scripts/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Gerar index.html do app a partir de web/
        run: node scripts/prepare-android-web.mjs

      # Com os Secrets GEOTOTAL_KEYSTORE_BASE64, GEOTOTAL_KEYSTORE_PASSWORD, GEOTOTAL_KEY_ALIAS e
      # GEOTOTAL_KEY_PASSWORD configurados, gera APK e AAB (Play Store) assinados com a chave de
      # upload; sem eles, gera só o APK de debug.
      - name: Preparar chave de assinatura
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.GEOTOTAL_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "GEOTOTAL_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compilar
        working-directory: android
        env:
          GEOTOTAL_KEYSTORE_PASSWORD: ${{ secrets.GEOTOTAL_KEYSTORE_PASSWORD }}
          GEOTOTAL_KEY_ALIAS: ${{ secrets.GEOTOTAL_KEY_ALIAS }}
          GEOTOTAL_KEY_PASSWORD: ${{ secrets.GEOTOTAL_KEY_PASSWORD }}
        run: |
          if [ "${{ steps.key.outputs.release }}" = "true" ]; then
            ./gradlew --no-daemon assembleRelease bundleRelease
            cp app/build/outputs/apk/release/app-release.apk ../geototal.apk
            cp app/build/outputs/bundle/release/app-release.aab ../geototal.aab
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../geototal.apk
          fi

      - name: AAB para a Play Store
        if: steps.key.outputs.release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: geototal-aab-playstore
          path: geototal.aab

      - uses: actions/upload-artifact@v4
        with:
          name: geototal-apk
          path: geototal.apk

      # Publica em Releases com link fixo quando se cria uma tag v* ou quando o commit
      # tem "[release]" na mensagem (aí a tag v<versionName> é criada pelo próprio workflow).
      - name: Versão do app
        id: ver
        run: echo "tag=v$(sed -n "s/.*versionName '\\(.*\\)'.*/\\1/p" android/app/build.gradle)" >> "$GITHUB_OUTPUT"

      - name: Publicar na página de Releases
        if: startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[release]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: geoTotal ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.ver.outputs.tag }}
          body: |
            **geoTotal**, criado por [alessandrocdrx](https://github.com/alessandrocdrx). Código aberto sob a licença Apache 2.0. Funciona sem internet.

            Baixe `geototal.apk` abaixo no celular (pelo Chrome), toque nele e permita "Instalar apps desconhecidos".
          make_latest: true
          files: geototal.apk
