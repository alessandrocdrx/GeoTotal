<!-- @arquivo componentes/app.html · Camada: Interface
     Tela principal: cabeçalho, chips, busca, palco do globo e cartão do país. -->
<div id="app">
  <header>
    <div class="htop">
      <h1 class="marca"><i class="marca-logo" aria-hidden="true"></i>geo<span>Total</span></h1>
      <div class="hbtns"><button id="msom" class="hsom" aria-label="Som ligado" title="Som">🔊</button><button id="mvisual" class="hsom" aria-label="Dia e noite" title="Dia e noite">☀️</button><button id="mestilotop" class="hsom" aria-label="Estilo do mapa: satélite" title="Satélite ou atlas">🛰️</button><button id="camb" class="hsom" aria-label="O que aparece no mapa" title="O que aparece no mapa" aria-expanded="false">🏷️</button><button id="streakpill" class="streakpill" style="display:none" aria-label="Sequência de dias"></button><div class="modesw" role="group" aria-label="Modo"><button id="qbtn" aria-pressed="false">Treino</button><button id="qclose" aria-pressed="true">Livre</button></div><button id="mbtn" aria-label="Mais opções">⋯</button></div>
    </div>
    <div class="sub" hidden>Países do Mundo: Nomes e Capitais por Região · <span id="count"></span> países e territórios</div>
  </header>
  <div class="chips" id="chips"></div>
  <div class="searchrow">
    <input id="q" type="search" placeholder="Buscar país ou capital" autocomplete="off" aria-label="Buscar país ou capital">
    <button id="fbtn">🌍 Filtrar</button>
    <div id="results"></div>
  </div>
  <div id="stage">
    <canvas id="gl"></canvas>
    <canvas id="g" aria-label="Globo terrestre interativo"></canvas>
    <div id="status"></div>
    <div id="pick"></div>
    <div id="dbar">
      <div class="dbtop"><div class="dbtxt"><b id="dbtit"></b><span id="dbtot"></span></div><button id="dexit" class="closeb">✕ Sair</button></div>
      <div id="dbmodo" class="aseg dbmodo"></div>
      <div id="dbnota" class="dbnota"></div>
      <div class="dbacoes"><select id="dbadd" class="dbadd" aria-label="Adicionar parada"></select><button id="dbmais" class="dbmais"></button></div>
      <div id="dblegs" hidden></div>
    </div>
    <div id="stbar"><span>🇧🇷 Estados</span><span class="stbtns"><button id="sttreino">🎯 Treinar</button><button id="stexit">← Países</button></span></div>
    <div class="seg" role="group" aria-label="Rótulos" hidden>
      <button id="lp" aria-pressed="true">País</button>
      <button id="lc" aria-pressed="false">Capital</button>
    </div>
    <div class="tools">
      <button id="zin" aria-label="Aproximar">+</button>
      <button id="zout" aria-label="Afastar">−</button>
      <button id="spin" aria-label="Giro automático" title="Giro automático" aria-pressed="true">🔄</button>
      <button id="tour" aria-label="Passeio pelos países" title="Passeio pelos países">🎬</button>
      <button id="flat2d" aria-label="Ver como mapa 2D" aria-pressed="false">🗺️</button>
    </div>
    <div id="camadas" class="camadas" hidden>
      <div class="camtit"><b>O que aparece no mapa</b><button id="camfechar" class="closeb" aria-label="Fechar">✕</button></div>
      <label class="mswrow"><span class="mi">🌊</span><span class="mt"><b>Oceanos</b></span><input type="checkbox" id="cOce" role="switch"><i class="msw" aria-hidden="true"></i></label>
      <label class="mswrow"><span class="mi">⛵</span><span class="mt"><b>Mares e golfos</b><small>Os menores aparecem ao aproximar</small></span><input type="checkbox" id="cMar" role="switch"><i class="msw" aria-hidden="true"></i></label>
      <label class="mswrow"><span class="mi">🌡️</span><span class="mt"><b>Zonas climáticas</b><small>Tropical, temperadas e polares; Equador e Trópicos</small></span><input type="checkbox" id="cZon" role="switch"><i class="msw" aria-hidden="true"></i></label>
      <label class="mswrow"><span class="mi">🏜️</span><span class="mt"><b>Desertos</b></span><input type="checkbox" id="cDes" role="switch"><i class="msw" aria-hidden="true"></i></label>
      <label class="mswrow"><span class="mi">🌳</span><span class="mt"><b>Florestas</b><small>Contorno aproximado</small></span><input type="checkbox" id="cFlo" role="switch"><i class="msw" aria-hidden="true"></i></label>
      <label class="mswrow"><span class="mi">⛰️</span><span class="mt"><b>Relevo</b><small>Cordilheiras e planaltos</small></span><input type="checkbox" id="cMon" role="switch"><i class="msw" aria-hidden="true"></i></label>
      <div class="camsep">Lugares (valem também no treino)</div>
      <label class="mswrow"><span class="mi">⚠️</span><span class="mt"><b>Não reconhecidos pela ONU</b><small>Kosovo, Somalilândia…</small></span><input type="checkbox" id="cDis" role="switch"><i class="msw" aria-hidden="true"></i></label>
      <label class="mswrow"><span class="mi">◇</span><span class="mt"><b>Territórios dependentes</b><small>Porto Rico, Groenlândia…</small></span><input type="checkbox" id="cDep" role="switch"><i class="msw" aria-hidden="true"></i></label>
      <label class="mswrow"><span class="mi">❄️</span><span class="mt"><b>Desabitados e Antártida</b></span><input type="checkbox" id="cUni" role="switch"><i class="msw" aria-hidden="true"></i></label>
    </div>
    <div id="legenda" class="legenda" hidden><b>Cada forma é um continente</b><div id="legitens" class="legitens"></div><button id="legok" class="legok">Entendi</button></div>
    <div class="hint" id="hint">Arraste para girar · toque num país para ver os detalhes</div>
    <div id="card" role="dialog" aria-live="polite">
      <div class="chead">
        <span id="cflag" class="flag"></span>
        <div class="ctitle">
          <div class="reg"><span class="dot" id="cdot"></span><span id="creg"></span></div>
          <h2 id="cname"></h2>
        </div>
        <button class="x" id="close" aria-label="Fechar">✕</button>
      </div>
      <div class="capbox"><span class="lab">🏛️ Capital</span><b id="ccap"></b><div class="capnote" id="ccapnote"></div></div>
      <div class="cstat" id="cstat"></div>
      <div id="cbody">
      <div class="facts" id="cfacts"></div>
      <div class="obs" id="cobs"></div>
      <div class="sect" id="cnb"></div>
      <div class="near" id="cncty" hidden></div>
      <div class="near" id="cnear" hidden></div>
      <button class="stbtn" id="stbtn">🇧🇷 Ver os 27 estados e capitais →</button>
      <div class="rowx"><button class="pill" id="nbtn">Só vizinhos no mapa</button></div>
      <button class="morefull" id="moreb">Ver mais detalhes ▾</button>
      <div class="info" id="cinfo" hidden></div>
      </div>
      <div class="nav"><button id="prev">← Anterior</button><button id="next">Próximo →</button></div>
    </div>
  </div>
</div>
