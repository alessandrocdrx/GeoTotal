name: Site

# Publica o site (site/ + a versão web do jogo em /jogar/) no GitHub Pages a cada mudança no main.
# Endereço: https://alessandrocdrx.github.io/GeoTotal/
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'web/geototal.html'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Montar o site
        run: |
          mkdir -p _site/jogar
          cp -r site/. _site/
          cp web/geototal.html _site/jogar/index.html
          sed -i "s/{{DATA}}/$(date -u +%F)/g" _site/sitemap.xml
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
