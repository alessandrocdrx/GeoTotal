<!-- @arquivo componentes/escopo.html · Camada: Interface
     Seletor "Onde você quer treinar?": cartões grandes por continente; o resto em "Mais opções". -->
<div id="scopesheet" class="ov" style="z-index:85"><div class="box">
  <div class="shead"><b>Onde você quer treinar?</b><button id="scopeclose" class="closeb" aria-label="Fechar">✕ Fechar</button></div>
  <button id="qscopeback" class="qbackrow" hidden></button>
  <button id="qrestart" class="restartrow" hidden></button>
  <div id="scopetiles" class="scopetiles"></div>
  <details id="scopeadv" class="scopeadv"><summary>🔎 Partes de um continente <small>(Caribe, Escandinávia, regiões do Brasil…)</small></summary>
  <input id="scopeq" type="search" placeholder="Buscar continente, sub-região ou Brasil…" autocomplete="off">
  <div class="row2" hidden><button id="scopeMulti" aria-pressed="false">➕ Combinar regiões</button></div>
  <div class="tgrow"><span class="tglab">Incluir também:</span><label class="tgchip"><input type="checkbox" id="oDisputedQ" checked><span>⚠ Países disputados</span></label><label class="tgchip"><input type="checkbox" id="oDepQ"><span>◇ Territórios de outros países</span></label><label class="tgchip"><input type="checkbox" id="oUniQ"><span>❄ Ilhas e bases sem moradores</span></label></div>
  <details id="catlista" class="catlista"><summary>📋 Quais são esses lugares?</summary><div id="catbody"></div></details>
  <div id="scopelist"></div>
  <div id="scopeempty" class="inote" style="display:none">Nada encontrado.</div>
  </details>
  <button id="scopeApply" class="scopeapplybtn" style="display:none"></button>
</div></div>
