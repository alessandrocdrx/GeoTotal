<!-- @arquivo componentes/compartilhar.html · Camada: Interface
     Painel de compartilhamento do resultado da partida. -->
<div id="sharesheet" class="ov" style="z-index:90"><div class="box">
  <div class="shead"><b>Compartilhar resultado</b><button id="shareclose" class="closeb" aria-label="Fechar">✕ Fechar</button></div>
  <img id="shareimg" alt="Imagem do resultado" style="width:100%;border-radius:14px;display:block">
  <div class="inote">Para salvar a imagem, toque e segure nela. O texto abaixo pode ser colado em qualquer conversa.</div>
  <textarea id="sharetxt" readonly style="width:100%;height:84px;margin-top:8px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--fg);font-size:13px;padding:8px;font-family:inherit"></textarea>
  <div class="row2"><button id="sharecopy">Copiar texto</button></div>
</div></div>
