plugins {
    id 'com.android.application'
}

// Chave de assinatura de release (upload key da Play Store). Vem das variáveis de ambiente,
// que o workflow preenche a partir dos Secrets do GitHub; sem elas, o release usa a chave de debug.
def keystorePath = System.getenv('GEOTOTAL_KEYSTORE')
def hasReleaseKey = keystorePath && file(keystorePath).exists()

android {
    namespace 'io.github.alessandrocdrx.geototal'
    compileSdk 36

    defaultConfig {
        applicationId 'io.github.alessandrocdrx.geototal'
        minSdk 26
        targetSdk 36
        versionCode 50
        versionName '1.44'
    }

    signingConfigs {
        // Chave de debug fixa, guardada no repositório: sem ela, cada build do GitHub Actions
        // sairia com uma chave nova e o Android não aceitaria instalar uma versão por cima da outra.
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasReleaseKey) {
            release {
                storeFile file(keystorePath)
                storePassword System.getenv('GEOTOTAL_KEYSTORE_PASSWORD')
                keyAlias System.getenv('GEOTOTAL_KEY_ALIAS')
                keyPassword System.getenv('GEOTOTAL_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            // R8: encolhe e otimiza o código (recomendação da Play). As regras em proguard-rules.pro
            // protegem a ponte com o JavaScript, que o WebView chama pelo nome.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Pedido de avaliação oficial do Google Play, dentro do app (In-App Review). Fala com o app da
    // Play Store pelo próprio aparelho: não precisa de permissão de internet.
    implementation 'com.google.android.play:review:2.0.2'
    // A biblioteca de avaliação traz versões antigas destas duas; a Play pede as atuais.
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'androidx.fragment:fragment:1.9.1'
}
